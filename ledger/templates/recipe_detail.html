{% extends 'base.html' %}

{% block body %}
    <h3>{{ recipe.name }}</h3>
    <div>created by {{ recipe.author.name }}</div>
    <h3>Ingredients</h3>
    <ul>
        {% for ingredient in recipe.ingredients.all %}
            <li style="list-style-type:square;">
                {{ ingredient.quantity }} of {{ ingredient.ingredient.name }}
            </li>
        {% endfor %}
    </ul>      
{% endblock %}
